# Google OAuth Configuration
# Follow these steps to set up Google OAuth:

# 1. Go to https://console.cloud.google.com/
# 2. Create a new project or select existing one
# 3. Enable Google+ API
# 4. Go to "Credentials" → "Create Credentials" → "OAuth 2.0 Client ID"
# 5. Application type: "Web application"
# 6. Add authorized redirect URIs:
#    - http://localhost:8501 (for local testing)
#    - https://your-app-url.streamlit.app (for deployed app)
# 7. Copy Client ID and Client Secret below

GOOGLE_CLIENT_ID = "your-client-id-here.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET = "your-client-secret-here"
REDIRECT_URI = "http://localhost:8501"  # Change to your deployed URL when deploying
